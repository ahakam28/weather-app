<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  </head>
  <body
    class="bg-gray-900 h-screen w-full flex gap-10 items-center justify-center"
  >
    <div
      class="lg:h-[580px] lg:w-[380px] h-[520px] w-[320px] bg-gradient-to-br from-[#48E0B4] via-[#509DA0] to-[#5C5E8F] p-8 rounded-2xl flex flex-col items-center justify-between"
    >
      <!-- Search Section -->
      <div class="flex items-center justify-between w-full gap-4">
        <input
          type="text"
          name=""
          placeholder="Search city..."
          id="search-city"
          class="bg-white w-full px-4 py-3 rounded-full outline-none font-semibold text-base"
        />

        <div
          id="search-icon"
          class="flex items-center justify-center bg-white p-3.5 rounded-full shrink-0 cursor-pointer"
        >
          <img
            src="./images/search.png"
            alt=""
            class="w-5 h-5 object-contain"
          />
        </div>
      </div>

      <!-- Weather Main Info -->
      <div class="text-center text-white flex flex-col items-center gap-2">
        <!-- Sun Icon -->
        <img
          id="weather-img"
          src="./images/clear.png"
          alt="Clear Weather"
          class="h-35 w-35"
        />

        <!-- Temperature & City -->
        <h1 id="temperature" class="text-6xl font-bold tracking-tight"></h1>
        <h1 id="city-name" class="text-3xl font-medium"></h1>
      </div>

      <!-- Weather Details (Humidity & Wind) -->
      <div class="w-full flex items-center justify-between">
        <div class="flex gap-2 items-center">
          <img src="./images/humidity.png" alt="" class="h-8 w-8" />

          <div class="text-white">
            <p id="humadity" class="font-semibold text-base"></p>
            <p class="text-xs">Humadity</p>
          </div>
        </div>

        <div class="flex gap-3 items-center">
          <img src="./images/wind.png" alt="" class="h-8 w-8" />

          <div class="text-white">
            <p id="wind-speed" class="font-semibold text-base"></p>
            <p class="text-xs">Wind Speed</p>
          </div>
        </div>
      </div>
    </div>

    <script src="./main.js"></script>
  </body>
</html>
